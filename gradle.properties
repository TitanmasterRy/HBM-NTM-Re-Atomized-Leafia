# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings give readable parameter names.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.244
loader_version_range=[1,)

## The base mod: HBM's Nuclear Tech Re-Atomized, consumed as libs/hbm-<hbm_version>.jar
hbm_mod_id=hbm
hbm_version=0.3.0

## Leafia's Cursed Addon
addon_id=leafia
addon_name=Leafia's Cursed Addon
addon_license=LGPL-3.0-only
addon_version=0.1.0
addon_group_id=com.leafia
addon_authors=ntmleafia and movblock; 1.21.1 NeoForge port by TitanmasterRy
addon_credits=ntmleafia (the addon), movblock (kickstarting it)

## Optional integrations
jei_version=19.28.0.351
